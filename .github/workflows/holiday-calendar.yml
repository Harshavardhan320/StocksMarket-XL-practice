name: Holiday Calendar Processor

on:
  push:
    branches:
      - main
    paths:
      - 'holidayCalendar/**'

jobs:
  process-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT for git history

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Detect changes and process files
        run: |
          echo "Detecting file changes..."

          git diff --name-status ${{ github.event.before }} ${{ github.sha }} > changes.txt

          cat changes.txt

          JSON_OUTPUT="[]"

          while read status file; do

            # Only process holidayCalendar folder
            if [[ "$file" != holidayCalendar/* ]]; then
              continue
            fi

            echo "Processing $file with status $status"

            FILE_STATUS=""

            if [[ "$status" == "A" ]]; then
              FILE_STATUS="ADDED"
              CONTENT=$(cat "$file")

            elif [[ "$status" == "M" ]]; then
              FILE_STATUS="MODIFIED"
              CONTENT=$(cat "$file")

            elif [[ "$status" == "D" ]]; then
              FILE_STATUS="REMOVED"
              CONTENT=$(git show ${{ github.event.before }}:"$file")
            else
              continue
            fi

            YEAR=$(basename "$file" .csv)

            echo "$CONTENT" | tail -n +2 | while IFS='|' read -r DATE DAY DESCRIPTION; do

              DATE=$(echo $DATE | xargs)
              DAY=$(echo $DAY | xargs)
              DESCRIPTION=$(echo $DESCRIPTION | xargs)

              NEW_JSON=$(jq -n \
                --arg year "$YEAR" \
                --arg holidayAt "$DATE" \
                --arg day "$DAY" \
                --arg description "$DESCRIPTION" \
                --arg status "$FILE_STATUS" \
                '{
                  year: $year,
                  holidayAt: $holidayAt,
                  day: $day,
                  description: $description,
                  gitHubFileStatus: $status
                }')

              JSON_OUTPUT=$(echo "$JSON_OUTPUT" | jq ". + [ $NEW_JSON ]")

            done

          done < changes.txt

          echo "Final JSON:"
          echo "$JSON_OUTPUT" > output.json
          cat output.json
          
          echo "========================================="
          echo "🎯 HOLIDAY CALENDAR PROCESSING COMPLETED"
          echo "========================================="
          
          TOTAL_RECORDS=$(jq length output.json)
          
          echo "📊 Total Records Processed: $TOTAL_RECORDS"
          
          echo "📁 Output File: output.json"
          
          if [ "$TOTAL_RECORDS" -eq 0 ]; then
            echo "⚠️ No data found to process"
          else
            echo "✅ Data successfully generated"
          fi
          
          echo "========================================="
          echo "📦 Final JSON Preview:"
          cat output.json
          echo "========================================="

