name: Holiday Calendar Processor

on:
  push:
    branches:
      - main
    paths:
      - 'holidayCalendar/**'

jobs:
  process-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Detect changes and process files
        run: |
          echo "Detecting file changes..."

          git diff --name-status ${{ github.event.before }} ${{ github.sha }} > changes.txt
          cat changes.txt

          JSON_OUTPUT="[]"

          while read status file; do

            # Only process target folder
            if [[ "$file" != holidayCalendar/* ]]; then
              continue
            fi

            echo "Processing $file with status $status"

            FILE_STATUS=""

            if [[ "$status" == "A" ]]; then
              FILE_STATUS="ADDED"
              CONTENT=$(cat "$file")

            elif [[ "$status" == "M" ]]; then
              FILE_STATUS="MODIFIED"
              CONTENT=$(cat "$file")

            elif [[ "$status" == "D" ]]; then
              FILE_STATUS="REMOVED"
              CONTENT=$(git show HEAD~1:"$file" 2>/dev/null || echo "")

              if [ -z "$CONTENT" ]; then
                echo "⚠️ Skipping $file (no content found)"
                continue
              fi
            else
              continue
            fi

            YEAR=$(basename "$file" .csv)

            echo "📄 Content Preview:"
            echo "$CONTENT" | head -5

            # 🔥 AUTO DETECT DELIMITER
            if echo "$CONTENT" | head -1 | grep -q '|'; then
              DELIM='|'
            else
              DELIM=','
            fi

            echo "🔍 Using delimiter: $DELIM"

            # 🔥 FIXED PARSING (NO SUBSHELL + HANDLE \r)
            while IFS="$DELIM" read -r DATE DAY DESCRIPTION; do

              DATE=$(echo "$DATE" | tr -d '\r' | xargs)
              DAY=$(echo "$DAY" | tr -d '\r' | xargs)
              DESCRIPTION=$(echo "$DESCRIPTION" | tr -d '\r' | xargs)

              # skip empty rows
              if [[ -z "$DATE" || "$DATE" == "Date" ]]; then
                continue
              fi

              NEW_JSON=$(jq -n \
                --arg year "$YEAR" \
                --arg holidayAt "$DATE" \
                --arg day "$DAY" \
                --arg description "$DESCRIPTION" \
                --arg status "$FILE_STATUS" \
                '{
                  year: $year,
                  holidayAt: $holidayAt,
                  day: $day,
                  description: $description,
                  gitHubFileStatus: $status
                }')

              JSON_OUTPUT=$(echo "$JSON_OUTPUT" | jq ". + [ $NEW_JSON ]")

            done < <(echo "$CONTENT")

          done < changes.txt

          echo "$JSON_OUTPUT" > output.json

          echo "========================================="
          echo "🎯 HOLIDAY CALENDAR PROCESSING COMPLETED"
          echo "========================================="

          TOTAL_RECORDS=$(jq length output.json)

          echo "📊 Total Records Processed: $TOTAL_RECORDS"
          echo "📁 Output File: output.json"

          if [ "$TOTAL_RECORDS" -eq 0 ]; then
            echo "⚠️ No data found to process"
          else
            echo "✅ Data successfully generated"
          fi

          echo "========================================="
          echo "📦 Final JSON Preview:"
          cat output.json
          echo "========================================="
