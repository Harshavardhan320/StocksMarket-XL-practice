name: Process Broker Data

on:
  push:
    branches:
      - main
    paths:
      - 'masterData/brokers/**'

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Print statement before server activation check [cite: 5, 10]
      - name: Pre-Activation Logs
        run: |
          echo "Starting workflow: Preparing to wake up services..."
          echo "Target Folder: masterData/brokers/**"

      # - name: Wake up Services
      #   run: |
      #     echo "Waking up Config Server..."
      #     curl -f -s https://funmarketconfigserver-dckt.onrender.com/actuator/health
      #     echo "Waking up Database Server..."
      #     curl -f -s https://funmarketdb.onrender.com/actuator/health

      - name: Parse CSV and Send Data
        shell: python
        run: |
          import csv
          import json
          import requests
          import glob
          import os

          # Look for CSVs in the masterData/brokers folder [cite: 6]
          path = 'masterData/brokers/**/*.csv'
          files = glob.glob(path, recursive=True)
          
          if not files:
              print("No CSV files found in masterData/brokers/")
              exit(0)

          all_data = []
          for file_path in files:
              print(f"Processing file: {file_path}")
              with open(file_path, mode='r', encoding='utf-8') as csvfile:
                  # Uses first row as keys for JSON objects [cite: 8, 9]
                  reader = csv.DictReader(csvfile)
                  for row in reader:
                      all_data.append(row)

          # Print collected data to console 
          print("Collected JSON Data:")
          print(json.dumps(all_data, indent=2))

          # Save to a local JSON file for the upload-artifact step
          with open('processed_broker_data.json', 'w') as f:
              json.dump(all_data, f, indent=2)

          # Final application send is disabled for testing [cite: 11]
          # if all_data:
          #     url = "https://funmarketdb.onrender.com/broker/addAllBroker"
          #     ...

      # This creates the download link in the GitHub Actions 'Summary' tab
      - name: Upload JSON for Download
        uses: actions/upload-artifact@v4
        with:
          name: broker-json-output
          path: processed_broker_data.json
