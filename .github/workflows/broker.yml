name: Process Broker Data

on:
  push:
    branches:
      - main
    paths:
      - 'masterData/brokers/**'

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pre-Activation Logs
        run: |
          echo "Starting workflow: Preparing to wake up services..."
          echo "Target Folder: masterData/brokers/**"

      # - name: Wake up Services
      #   run: |
      #     echo "Waking up Config Server..."
      #     curl -f -s https://funmarketconfigserver-dckt.onrender.com/actuator/health
          
      #     echo "Waking up Database Server..."
      #     curl -f -s https://funmarketdb.onrender.com/actuator/health
      #     # -f ensures the script stops if a server returns an error

      - name: Parse Touched CSVs and Send Data
        shell: python
        run: |
          import csv
          import json
          import requests
          import subprocess
          import os

          def get_changed_files():
              # Gets the status and file path of changes in the latest commit
              # Output format: STATUS PATH (e.g., A masterData/brokers/test.csv)
              cmd = ["git", "diff-tree", "--no-commit-id", "--name-status", "-r", "HEAD"]
              result = subprocess.run(cmd, capture_output=True, text=True)
              lines = result.stdout.strip().split('\n')
              
              changed_files = []
              for line in lines:
                  if not line: continue
                  status, path = line.split(None, 1)
                  # Filter only for CSVs in the specific directory
                  if path.startswith('masterData/brokers/') and path.endswith('.csv'):
                      changed_files.append((status, path))
              return changed_files

          def get_csv_content(status, path):
              # If deleted, we must fetch the content from the previous commit
              if status == 'D':
                  cmd = ["git", "show", f"HEAD~1:{path}"]
                  result = subprocess.run(cmd, capture_output=True, text=True)
                  return result.stdout.splitlines()
              else:
                  with open(path, mode='r', encoding='utf-8') as f:
                      return f.readlines()

          files = get_changed_files()
          
          if not files:
              print("No relevant CSV changes detected in this commit.")
              exit(0)

          all_data = []
          status_map = {'A': 'ADDED', 'M': 'MODIFIED', 'D': 'REMOVED'}

          for status, file_path in files:
              print(f"Processing {status_map.get(status, 'UNKNOWN')}: {file_path}")
              
              content = get_csv_content(status, file_path)
              if not content: continue
              
              reader = csv.DictReader(content)
              for row in reader:
                  # Inject the recordStatus based on Git action
                  row['recordStatus'] = status_map.get(status, 'UNKNOWN')
                  all_data.append(row)

          # Print collected data to console for visibility
          print("Collected JSON Data (Touched Records Only):")
          formatted_json = json.dumps(all_data, indent=2)
          print(formatted_json)

          # Save to local file for the artifact download
          with open('processed_broker_data.json', 'w') as f:
              json.dump(all_data, f, indent=2)

          # Send data to the application API
          # if all_data:
          #     url = "https://funmarketdb.onrender.com/broker/addAllBroker"
          #     print(f"Sending data to {url}...")
          #     response = requests.post(url, json=all_data)
              
          #     if response.status_code == 200:
          #         print(f"Success! Sent {len(all_data)} records.")
          #     else:
          #         print(f"Failed to send data. Status Code: {response.status_code}")
          #         print(f"Response: {response.text}")
          #         exit(1)

      - name: Upload JSON for Download
        uses: actions/upload-artifact@v4
        with:
          name: broker-json-output
          path: processed_broker_data.json
          retention-days: 7
